<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="174.00mm" height="107.61mm" viewBox="0 0 760 470" role="img" font-family="Helvetica, Arial, sans-serif">
<title>A PAM-altering variant separates the two alleles where repeat length cannot</title>
<desc>Panel A: at rs2075974 the expanded chromosome carries C, completing an NGG PAM, and is cut; the normal chromosome carries T, has no PAM and cannot be cut. Panel B: the expanded ATXN1 tract is 1.5x the normal one against 2.6x at HTT.</desc>
<rect x="0" y="0" width="760" height="470" fill="#FFFFFF"/>
<text x="24.0" y="28.0" font-size="15" fill="#1A1A1A" text-anchor="start" font-weight="bold">A PAM-altering variant separates the two alleles where repeat length cannot</text>
<text x="24.0" y="48.0" font-size="11.5" fill="#595959" text-anchor="start" font-weight="normal">Representative allele sizes; rs2075974 lies 537 bp from the ATXN1 CAG tract</text>
<text x="24.0" y="82.0" font-size="13" fill="#1A1A1A" text-anchor="start" font-weight="bold">A   Cas9 reads a single base at rs2075974</text>
<rect x="160.0" y="122.0" width="410.0" height="4.0" rx="2" fill="#DCDCDC"/>
<rect x="290.0" y="115.0" width="144.0" height="18.0" rx="4" fill="#D7E6F7" stroke="#1F6FD0" stroke-width="1.1"/>
<rect x="213.0" y="111.0" width="30.0" height="26.0" rx="6" fill="#D7E6F7" stroke="#1F6FD0" stroke-width="2"/>
<text x="228.0" y="129.0" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="bold">C</text>
<text x="24.0" y="129.0" font-size="13" fill="#1A1A1A" text-anchor="start" font-weight="normal">Expanded allele</text>
<text x="228.0" y="100.0" font-size="11.5" fill="#1A1A1A" text-anchor="middle" font-weight="bold">AGG = PAM</text>
<text x="362.0" y="109.0" font-size="11.5" fill="#595959" text-anchor="middle" font-weight="normal">45 CAG</text>
<text x="596.0" y="129.0" font-size="13" fill="#1A1A1A" text-anchor="start" font-weight="bold">Cas9 cuts</text>
<rect x="160.0" y="200.0" width="410.0" height="4.0" rx="2" fill="#DCDCDC"/>
<rect x="290.0" y="193.0" width="96.0" height="18.0" rx="4" fill="#F2F2F0" stroke="#8C8C8C" stroke-width="1.1"/>
<rect x="213.0" y="189.0" width="30.0" height="26.0" rx="6" fill="#FFFFFF" stroke="#8C8C8C" stroke-width="1.1"/>
<text x="228.0" y="207.0" font-size="14" fill="#1A1A1A" text-anchor="middle" font-weight="bold">T</text>
<text x="24.0" y="207.0" font-size="13" fill="#1A1A1A" text-anchor="start" font-weight="normal">Normal allele</text>
<text x="228.0" y="178.0" font-size="11.5" fill="#595959" text-anchor="middle" font-weight="normal">AAG = no PAM</text>
<text x="338.0" y="187.0" font-size="11.5" fill="#595959" text-anchor="middle" font-weight="normal">30 CAG</text>
<text x="596.0" y="207.0" font-size="13" fill="#595959" text-anchor="start" font-weight="normal">cannot be cut</text>
<line x1="24.0" y1="258.0" x2="736.0" y2="258.0" stroke="#DCDCDC" stroke-width="0.8"/>
<text x="24.0" y="288.0" font-size="13" fill="#1A1A1A" text-anchor="start" font-weight="bold">B   Repeat length gives too little to work with at ATXN1</text>
<text x="24.0" y="327.0" font-size="11.5" fill="#1A1A1A" text-anchor="start" font-weight="normal">ATXN1 expanded</text>
<rect x="190.0" y="314.0" width="144.0" height="16.0" rx="4" fill="#D7E6F7" stroke="#1F6FD0" stroke-width="1.1"/>
<text x="344.0" y="327.0" font-size="11.5" fill="#595959" text-anchor="start" font-weight="normal">45</text>
<text x="24.0" y="359.0" font-size="11.5" fill="#1A1A1A" text-anchor="start" font-weight="normal">ATXN1 normal</text>
<rect x="190.0" y="346.0" width="96.0" height="16.0" rx="4" fill="#F2F2F0" stroke="#8C8C8C" stroke-width="1.1"/>
<text x="296.0" y="359.0" font-size="11.5" fill="#595959" text-anchor="start" font-weight="normal">30</text>
<text x="24.0" y="403.0" font-size="11.5" fill="#1A1A1A" text-anchor="start" font-weight="normal">HTT expanded</text>
<rect x="190.0" y="390.0" width="144.0" height="16.0" rx="4" fill="#F2F2F0" stroke="#8C8C8C" stroke-width="1.1"/>
<text x="344.0" y="403.0" font-size="11.5" fill="#595959" text-anchor="start" font-weight="normal">45</text>
<text x="24.0" y="435.0" font-size="11.5" fill="#1A1A1A" text-anchor="start" font-weight="normal">HTT normal</text>
<rect x="190.0" y="422.0" width="54.4" height="16.0" rx="4" fill="#F2F2F0" stroke="#8C8C8C" stroke-width="1.1"/>
<text x="254.4" y="435.0" font-size="11.5" fill="#595959" text-anchor="start" font-weight="normal">17</text>
<line x1="520.0" y1="314.0" x2="520.0" y2="362.0" stroke="#1F6FD0" stroke-width="1.1"/>
<text x="532.0" y="342.0" font-size="11.5" fill="#1A1A1A" text-anchor="start" font-weight="bold">1.5× longer</text>
<line x1="520.0" y1="390.0" x2="520.0" y2="438.0" stroke="#8C8C8C" stroke-width="1.1"/>
<text x="532.0" y="418.0" font-size="11.5" fill="#595959" text-anchor="start" font-weight="normal">2.6× longer</text>
</svg>
